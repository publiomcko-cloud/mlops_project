[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml_classifier"
version = "0.4.0"
requires-python = ">=3.12"
dependencies = [
    "dvc==3.59.1",
    "pathspec==0.11.2",
    "mlflow==2.22.1",
    "flask==2.2.5",
    "Werkzeug==2.3.8",
    "dagshub==0.5.9",
    "gunicorn==23.0.0",
    "python-dotenv==1.1.0",
    "joblib==1.4.2",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "PyYAML==6.0.2",
    "scikit-learn==1.6.1",
    "tensorflow==2.19.0"
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5"
]
orchestration = [
    "apache-airflow==2.10.5"
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
