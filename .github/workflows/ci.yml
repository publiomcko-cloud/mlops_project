name: CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            flask==2.2.5 \
            Werkzeug==2.3.8 \
            joblib==1.4.2 \
            numpy==2.1.3 \
            pandas==2.2.3 \
            PyYAML==6.0.2 \
            scikit-learn==1.6.1 \
            pytest==8.3.5

      - name: Compile Python sources
        run: python -m compileall -q app src tests

      - name: Validate DVC YAML
        run: python -c "import yaml; yaml.safe_load(open('dvc.yaml', encoding='utf-8'))"

      - name: Run tests
        run: python -m pytest
