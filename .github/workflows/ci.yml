name: CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            flask==2.2.5 \
            Werkzeug==2.3.8 \
            joblib==1.4.2 \
            python-dotenv==1.1.0 \
            numpy==2.1.3 \
            pandas==2.2.3 \
            PyYAML==6.0.2 \
            scikit-learn==1.6.1 \
            pytest==8.3.5

      - name: Compile Python sources
        run: python -m compileall -q app src tests

      - name: Validate DVC YAML
        run: python -c "import yaml; yaml.safe_load(open('dvc.yaml', encoding='utf-8'))"

      - name: Run tests
        run: python -m pytest

  pipeline-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install full runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Reduce training duration for CI smoke test
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path("params.yaml")
          params = yaml.safe_load(path.read_text(encoding="utf-8"))
          params["train"]["epochs"] = 2
          path.write_text(
              yaml.safe_dump(params, sort_keys=False),
              encoding="utf-8",
          )
          PY

      - name: Run full DVC pipeline
        env:
          MLFLOW_TRACKING_URI: file:./mlruns
        run: dvc repro

      - name: Verify generated metrics and model readiness
        env:
          MODEL_SOURCE: local
        run: |
          dvc metrics show
          python - <<'PY'
          from app.main import create_app

          app = create_app()
          app.config["TESTING"] = True
          response = app.test_client().get("/ready")
          assert response.status_code == 200, response.get_data(as_text=True)
          PY
